<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121426">
<title>🍋 לימונדה בע״מ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Rubik:wght@400;500;600;700&display=swap">
<style>
/* Management-game layout: status header on top, one section in the middle, the "continue" bar and section nav at the bottom */
:root{
  --night:#121426;      /* app ground */
  --panel:#1C1F38;      /* blocks */
  --panel-2:#252949;    /* rows inside blocks */
  --line:#33385E;
  --ink:#F3F1E8;        /* main text */
  --dim:#A5A8C8;        /* secondary text */
  --lemon:#FFD23F;      /* the one accent */
  --lemon-ink:#2B2100;
  --good:#4ADE80; --warn:#FBBF24; --bad:#FB7185;
  --f-display:"Fredoka","Rubik",system-ui,sans-serif;
  --f-body:"Rubik",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
#root{height:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:2px solid var(--lemon);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-display);direction:ltr;unicode-bidi:isolate}
h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--night)}
/* Header tint follows the time of day */
.top{padding:10px max(16px,env(safe-area-inset-left,0px)) 10px;background:linear-gradient(170deg,#2A2F63,#1C1F38);border-bottom:1px solid var(--line);transition:background .8s}
.sky-eve .top{background:linear-gradient(170deg,#3B2A6B,#5C3570 60%,#7A3E5E)}
.sky-day .top{background:linear-gradient(170deg,#1E5C9A,#2E79B8 60%,#3E8FC4)}
.sky-dusk .top{background:linear-gradient(170deg,#7A3E5E,#B4544A 60%,#D9773E)}
.t-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.t-when{display:flex;flex-direction:column}
.t-ph{font-size:12px;color:rgba(255,255,255,.75);font-weight:600}
.t-when b{font-family:var(--f-display);font-size:22px;font-weight:600}
.t-when i{font-style:normal;font-size:14px;opacity:.6}
.t-cash{display:flex;flex-direction:column;align-items:flex-end;background:rgba(0,0,0,.25);padding:6px 12px;border-radius:12px}
.t-cash small{font-size:11px;color:rgba(255,255,255,.7)}
.t-cash b{font-size:22px;color:var(--lemon);line-height:1.1}
.t-cash span{font-size:11px;color:var(--warn)}
.res{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.res span{background:rgba(0,0,0,.25);border-radius:10px;padding:4px 9px;font-size:13px;display:flex;align-items:center;gap:4px}
.res b{font-size:15px}
.res i{font-style:normal;color:var(--good);font-family:var(--f-display);font-weight:600}
.res .r{color:var(--bad)}

.main{flex:1;min-height:0;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 12px;animation:paneIn .3s var(--ease-out);scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
@keyframes paneIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pane{display:flex;flex-direction:column;gap:12px}
.pane-h h2{font-size:22px}
.pane-h p{margin:4px 0 0;color:var(--dim);font-size:13.5px;line-height:1.5}

/* Inbox */
.inbox{display:flex;flex-direction:column;gap:6px}
.msg{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:right;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;position:relative}
.msg.new::before{content:"";position:absolute;top:12px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--lemon);box-shadow:0 0 8px var(--lemon)}
.msg.warn{border-color:#6B4A1E;background:linear-gradient(90deg,#2E2516,var(--panel))}
.msg-ic{font-size:24px;text-align:center}
.msg-tx{display:flex;flex-direction:column;min-width:0}
.msg-tx b{font-size:14.5px}
.msg-tx span{font-size:12.5px;color:var(--dim);margin-top:2px}
.msg-cta{font-size:12px;font-weight:700;color:var(--lemon);white-space:nowrap}
.checklist{background:var(--panel);border-radius:14px;padding:8px}
.cl-h{font-size:12px;font-weight:700;color:var(--dim);padding:4px 6px 6px;letter-spacing:.02em}
.cl-row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;width:100%;text-align:right;padding:9px 6px;border-radius:10px;font-size:14px}
.cl-row:hover{background:var(--panel-2)}
.cl-st{color:var(--dim);font-weight:700}
.cl-row.done .cl-st{color:var(--good)}

/* Blocks */
.blk{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.blk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.blk-h h3{font-size:17px}
.tag{font-size:11.5px;color:var(--dim);background:var(--panel-2);padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.good{color:var(--good)}
.note{background:var(--panel-2);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--dim);line-height:1.5}
.note.good{color:var(--ink);background:#1F3A2C;margin-top:10px}
.hint{font-size:12px;color:var(--dim);margin-top:8px}
.budget{background:#2E2A12;border:1px solid #5A4E1A;border-radius:12px;padding:9px 12px;font-size:13.5px}
.budget b{color:var(--lemon);font-size:16px}
.budget span{color:var(--dim)}

/* Stepper */
.stp{display:inline-flex;align-items:center;gap:4px;background:var(--night);border-radius:12px;padding:3px}
.stp button{width:34px;height:34px;border-radius:10px;background:var(--panel-2);font-size:18px;font-weight:700}
.stp button:active:not(:disabled){transform:scale(.92)}
.stp .stp-5{width:auto;padding:0 8px;font-size:12.5px;background:#3A3412;color:var(--lemon)}
.stp-v{min-width:30px;text-align:center;font-size:18px;font-weight:600}

/* Product */
.recipe{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;align-items:center}
.glass-wrap{position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#2E3466,transparent 70%);border-radius:16px}
.glass{width:140px;height:auto;display:block;overflow:visible}
.glass-liq{transition:fill .4s}
.glass-ice{animation:iceDrop .5s var(--spring) both}
@keyframes iceDrop{from{transform:translateY(-40px);opacity:0}}
.glass-bub{animation:bubUp 3s ease-in infinite}
@keyframes bubUp{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-110px);opacity:0}}
@media (max-width:380px){.recipe{grid-template-columns:110px minmax(0,1fr)}.glass{width:110px}}
.cup{display:flex;flex-direction:column;gap:2px;padding:4px;border:2px solid #5A608F;border-top:none;border-radius:0 0 14px 14px;height:150px;justify-content:flex-end}
.cup span{flex:1;border-radius:4px;transition:background .3s}
.cup-l{background:#FFD23F}.cup-h{background:#FF8A65}.cup-i{background:#8BE3FF}.cup-w{background:#2D3A63}
.ings{display:flex;flex-direction:column;gap:8px}
.ing{background:var(--panel-2);border-radius:12px;padding:7px 10px}
.ing-t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ing-t b{font-size:14.5px}
.ing-d{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--dim);margin-top:4px;align-items:center}
.water{font-size:12px;color:var(--dim)}
.dl{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--line)}
.dl.up{background:#1F3A2C;color:var(--good)}.dl.dn{background:#3D1E28;color:var(--bad)}
.fx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.fx-c{display:flex;flex-direction:column;background:var(--panel-2);border-radius:10px;padding:6px 8px;font-size:12.5px;font-weight:600}
.fx-c small{font-size:10.5px;color:var(--dim);font-weight:500}
.fx-c.good{color:var(--good)}.fx-c.warn{color:var(--warn)}.fx-c.bad{color:var(--bad)}
.pq{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pq-c{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel-2);border-radius:12px;padding:10px 6px;text-align:center}
.pq-c small{color:var(--dim);font-size:12px}
.big{font-size:30px;font-weight:600;color:var(--lemon);line-height:1}
.limit{font-size:11.5px;color:var(--dim);line-height:1.4}
.limit b{color:var(--ink)}
@media (max-width:390px){.pq{grid-template-columns:1fr}}
.aud-r{display:grid;grid-template-columns:86px minmax(0,1fr) 44px 104px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.aud-n{font-weight:600;white-space:nowrap}
.aud-b{height:10px;background:var(--night);border-radius:5px;overflow:hidden}
.aud-b i{display:block;height:100%;border-radius:5px;transition:width .4s var(--ease-out)}
.aud-b .g{background:var(--good)}.aud-b .y{background:var(--warn)}.aud-b .r{background:var(--bad)}
.aud-x{font-size:12px;color:var(--dim);text-align:center}.aud-x b{font-size:15px;color:var(--ink)}
.why{font-size:11.5px;font-weight:700;padding:3px 6px;border-radius:7px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why.good{background:#1F3A2C;color:var(--good)}.why.warn{background:#3A3012;color:var(--warn)}.why.bad{background:#3D1E28;color:var(--bad)}
.aud-tot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--dim)}
.aud-lock{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;font-size:12.5px;color:var(--dim)}
.aud-lock>span{font-size:26px}.aud-lock b{color:var(--ink);font-size:14px}

/* Shop items */
.shop{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:12px;padding:9px 10px;border:1px solid transparent}
.item.own,.item.on{border-color:#2F6B47;background:#1D3326}
.item.dark{background:#1A1830}
.item.dark.on{border-color:#7A2A3C;background:#2A1520}
.item.lock{opacity:.55}
.it-e{font-size:24px;text-align:center}
.it-t{display:flex;flex-direction:column;min-width:0}
.it-t b{font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.it-t span{font-size:12px;color:var(--dim);margin-top:1px}
.it-t em{font-style:normal;font-size:10.5px;color:var(--bad);background:#3D1E28;padding:1px 6px;border-radius:6px}
.it-t em.acc{color:var(--dim);background:var(--line)}
.badge{font-size:11.5px;font-weight:700;color:var(--dim);white-space:nowrap}
.badge.g{color:var(--good)}

/* Buttons */
.btn{background:var(--lemon);color:var(--lemon-ink);font-weight:700;border-radius:11px;padding:9px 14px;box-shadow:0 3px 0 #B8901B;white-space:nowrap;transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #B8901B}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.g{background:var(--good);color:#0B2A17;box-shadow:0 3px 0 #22894B}
.btn.r{background:var(--bad);color:#3A0B16;box-shadow:0 3px 0 #B4405A}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 3px 0 #0A0B18;border:1px solid var(--line)}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:600}
.chip:hover:not(:disabled){border-color:var(--lemon)}
.qf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:10px;font-size:12.5px;color:var(--dim)}

/* Stock */
.stock{display:flex;flex-direction:column;gap:6px}
.st-r{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--panel-2);border-radius:12px;padding:9px 10px;border:1px solid transparent}
.st-r.on{border-color:#2F6B47}
.st-ic{font-size:24px;text-align:center}
.st-i{display:flex;flex-direction:column}.st-i b{font-size:14.5px}.st-i span{font-size:12px;color:var(--dim)}
.st-q{display:flex;align-items:center;gap:5px;font-size:18px;font-weight:600}
.st-q i{font-style:normal;color:var(--dim);font-size:13px}.st-q b{color:var(--good)}
.st-s{grid-column:1/-1;display:flex;justify-content:center;margin-top:4px}

/* Business */
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.loc{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--panel-2);border:2px solid transparent;border-radius:12px;padding:10px 4px;text-align:center}
.loc span{font-size:24px}.loc b{font-size:13px}.loc small{font-size:10.5px;color:var(--dim);line-height:1.3}
.loc.on{border-color:var(--lemon);background:#2E2A12}
.fc-card{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:center;background:linear-gradient(150deg,#2A2F63,#3B2A6B);border-radius:12px;padding:12px}
.fc-e{font-size:40px;text-align:center}
.fc-card div{display:flex;flex-direction:column;gap:2px}
.fc-card b{font-family:var(--f-display);font-size:20px;font-weight:600}
.fc-card span{font-size:12.5px;color:var(--dim)}
.fc-card .fc-v{color:var(--lemon)}

/* Bottom: continue bar + nav */
.cta-bar{padding:8px max(16px,env(safe-area-inset-left,0px)) 8px;border-top:1px solid var(--line);background:var(--night)}
.cta-info{font-size:12.5px;color:var(--dim);text-align:center;margin-bottom:6px}
.cta{width:100%;background:var(--lemon);color:var(--lemon-ink);font-family:var(--f-display);font-weight:600;font-size:18px;padding:13px;border-radius:14px;box-shadow:0 4px 0 #B8901B;transition:transform .08s}
.cta:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #B8901B}
.cta.ghost{background:var(--panel-2);color:var(--ink);box-shadow:0 4px 0 #0A0B18}
.nav{display:grid;grid-template-columns:repeat(6,1fr);background:#0D0F1E;border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:10px;position:relative;color:var(--dim)}
.nav button span{font-size:20px;filter:grayscale(.6);transition:transform .2s var(--spring)}
.nav button small{font-size:11px;font-weight:600}
.nav button.on{color:var(--lemon);background:#1C1F38}
.nav button.on span{filter:none;transform:scale(1.12)}
.nav em{position:absolute;top:2px;left:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-style:normal;font-size:10.5px;font-weight:700;display:grid;place-items:center}

/* Report */
.report{display:flex;flex-direction:column;gap:12px}
.rp-hero{text-align:center;padding:18px 12px;border-radius:18px;background:linear-gradient(170deg,#7A3E5E,#B4544A 70%,#D9773E)}
.rp-day{font-size:13px;color:rgba(255,255,255,.8);font-weight:600}
.rp-big{font-size:52px;font-weight:600;line-height:1.05}
.rp-big.g{color:#C8FFD9}.rp-big.r{color:#FFD0D8}
.rp-sub{font-size:13px;color:rgba(255,255,255,.85)}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-grid div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column}
.rp-grid small{font-size:12px;color:var(--dim)}
.rp-grid b{font-size:24px;font-weight:600}.rp-grid b i{font-size:14px;color:var(--dim);font-style:normal}
.rp-grid i{font-style:normal;font-size:12px;color:var(--dim)}
.g{color:var(--good)}.r{color:var(--bad)}.y{color:var(--lemon)}
.rp-tips{background:var(--panel);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.tip{font-size:13.5px;padding:8px 10px;border-radius:10px;background:var(--panel-2);border-inline-start:4px solid var(--line);line-height:1.45}
.tip.good{border-inline-start-color:var(--good)}.tip.warn{border-inline-start-color:var(--warn)}.tip.bad{border-inline-start-color:var(--bad)}
.rp-tot{text-align:center;font-size:13.5px;color:var(--dim)}.rp-tot b{color:var(--lemon);font-size:17px}

/* Simulation */
.simwrap{display:flex;flex-direction:column;gap:10px}
.sim-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sim-stats div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;display:flex;flex-direction:column}
.sim-stats small{font-size:12px;color:var(--dim)}.sim-stats b{font-size:26px;font-weight:600}.sim-stats i{font-size:13px;color:var(--dim);font-style:normal}
.sim-q{display:grid;grid-template-columns:34px auto 1fr auto;gap:8px;align-items:center;background:var(--panel);border-radius:14px;padding:10px 12px;font-size:13.5px}
.sim-q>span:first-child{font-size:24px}.sim-q span:nth-child(3){color:var(--dim)}.sim-rx{font-size:24px}

/* Confirm dialog */
.dlg-bg{position:absolute;inset:0;background:rgba(5,6,15,.7);display:grid;place-items:center;padding:20px;z-index:50;animation:fade .2s}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:340px;width:100%;animation:pop .3s var(--spring)}
.dlg b{font-family:var(--f-display);font-size:19px;font-weight:600}
.dlg p{color:var(--dim);font-size:14px;line-height:1.5}
.dlg-b{display:flex;gap:8px;justify-content:flex-start}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.9);opacity:0}}

/* Coin feedback */
.fly{position:fixed;z-index:200;pointer-events:none;font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--bad);text-shadow:0 2px 8px rgba(0,0,0,.6);transform:translate(-50%,-50%);animation:flyUp 1s var(--ease-out) forwards}
.fly.good{color:var(--good)}
@keyframes flyUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.6)}20%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-240%)}}

/* Sky show between parts of the day */
.sky{position:absolute;inset:0;z-index:100;overflow:hidden;display:flex;align-items:center;justify-content:center;animation:skyFade 2.3s ease forwards;cursor:pointer}
@keyframes skyFade{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
.sky-dusk{background:linear-gradient(180deg,#1B1446 0%,#5C3570 40%,#D9773E 75%,#FFB25B 100%);animation-name:skyFade}
.sky-dawn{background:linear-gradient(180deg,#5FB8F2 0%,#A6DEFF 45%,#FFE3A3 80%,#FFC46B 100%)}
.sky-orb{position:absolute;width:110px;height:110px;border-radius:50%;left:50%;margin-left:-55px}
.sky-dusk .sky-orb{background:radial-gradient(circle,#FFE9A8,#FF9E4A);box-shadow:0 0 80px 30px rgba(255,158,74,.6);animation:sunDown 2.2s var(--ease-out) forwards}
.sky-dawn .sky-orb{background:radial-gradient(circle,#FFFBE0,#FFD23F);box-shadow:0 0 90px 36px rgba(255,210,63,.7);animation:sunUp 2.2s var(--ease-out) forwards}
@keyframes sunDown{from{top:20%}to{top:78%}}
@keyframes sunUp{from{top:80%}to{top:18%}}
.sky-hills{position:absolute;bottom:0;left:-10%;right:-10%;height:28%;background:radial-gradient(ellipse at 30% 100%,#1E2A1E 60%,transparent 61%),radial-gradient(ellipse at 75% 100%,#25331F 55%,transparent 56%);}
.sky-dawn .sky-hills{background:radial-gradient(ellipse at 30% 100%,#5DAA4A 60%,transparent 61%),radial-gradient(ellipse at 75% 100%,#76C255 55%,transparent 56%)}
.sky-stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;animation:twinkle 1.4s ease-in-out .6s infinite alternate}
.sky-dawn .sky-stars{display:none}
@keyframes twinkle{to{opacity:.9}}
.sky-text{position:relative;text-align:center;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.4);animation:textIn .9s var(--spring) .2s both}
.sky-l1{font-family:var(--f-display);font-size:58px;font-weight:600;line-height:1}
.sky-l2{font-size:18px;margin-top:6px;opacity:.9}
.sky-dawn .sky-text{color:#1B2A44;text-shadow:0 2px 14px rgba(255,255,255,.6)}
@keyframes textIn{from{opacity:0;transform:scale(.7) translateY(20px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Assistant / event actions inside a message */
.msg-act{align-self:flex-start;margin-top:6px;background:var(--lemon);color:var(--lemon-ink);font-weight:700;font-size:12.5px;padding:5px 12px;border-radius:9px;box-shadow:0 2px 0 #B8901B}
.msg-act:active{transform:translateY(1px)}
.chip.back{align-self:flex-start}
/* Report: who bought, per customer type */
.rp-types{background:var(--panel);border-radius:14px;padding:8px 10px}
.rt-r{display:grid;grid-template-columns:86px minmax(0,1fr) 44px 98px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.rt-n{font-weight:600;white-space:nowrap}
.rt-x{font-size:12px;color:var(--dim);text-align:center}.rt-x b{font-size:15px;color:var(--ink)}
/* Season end */
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.stars span{font-size:34px;color:rgba(255,255,255,.3);animation:pop .5s var(--spring) backwards}
.stars span.on{color:#FFE45C;text-shadow:0 0 18px rgba(255,210,63,.8)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:18px}
.ch-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;min-width:0}
.ch-bar{width:100%;border-radius:6px 6px 2px 2px;animation:grow .6s var(--ease-out) both;transform-origin:bottom}
.ch-bar.g{background:linear-gradient(180deg,var(--good),#1F7A45)}.ch-bar.r{background:linear-gradient(180deg,var(--bad),#9B2C44)}
.ch-col small{font-size:10px;color:var(--dim)}.ch-col i{font-style:normal;font-size:11px;color:var(--dim)}
@keyframes grow{from{transform:scaleY(0)}}

/* ── Living weather behind the whole screen ── */
.app{isolation:isolate}
.app>.top,.app>.main,.app>.cta-bar,.app>.nav{position:relative;z-index:1}
.app>.top{background:rgba(8,10,26,.38)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom-color:rgba(255,255,255,.08)}
.app>.cta-bar{background:rgba(10,12,28,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.app>.nav{background:rgba(6,7,18,.85)}
.blk,.msg,.checklist,.task,.rp-tips,.rp-types,.rp-grid div,.sim-stats div,.sim-q{background-color:rgba(28,31,56,.92)}
.wx{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.app.bg-night{background:linear-gradient(180deg,#1B1446 0%,#121426 55%,#0C0D1C 100%)}
.app.bg-dusk{background:linear-gradient(180deg,#7A3E5E 0%,#3A2550 40%,#121426 100%)}
.app.bg-sunny,.app.bg-nice{background:linear-gradient(180deg,#2A78C8 0%,#1C4E8A 30%,#121426 75%)}
.app.bg-hot{background:linear-gradient(180deg,#D9622B 0%,#8E3A1E 32%,#1A1420 80%)}
.app.bg-heat{background:linear-gradient(180deg,#F04A1A 0%,#A3301A 30%,#21121A 80%)}
.app.bg-cloudy{background:linear-gradient(180deg,#5B6680 0%,#363E55 35%,#14172A 80%)}
.app.bg-lRain{background:linear-gradient(180deg,#3E4A62 0%,#262E44 35%,#0F1222 80%)}
.app.bg-hRain{background:linear-gradient(180deg,#2B3448 0%,#1A2033 35%,#0A0C18 80%)}
.app.bg-cold{background:linear-gradient(180deg,#6F93C2 0%,#3D5A85 32%,#121A2E 80%)}
.wx-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.2;animation:wxTw 3s ease-in-out infinite alternate}
@keyframes wxTw{to{opacity:.9}}
.wx-moon{position:absolute;top:28px;left:28px;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFFBE6,#E8E1C0);box-shadow:0 0 40px 10px rgba(255,250,220,.25),inset -10px -6px 0 rgba(0,0,0,.08)}
.wx-sun{position:absolute;top:-40px;left:-40px;width:200px;height:200px}
.wx-sun::before{content:"";position:absolute;inset:60px;border-radius:50%;background:radial-gradient(circle,#FFF6C2,#FFC93C);box-shadow:0 0 70px 30px rgba(255,201,60,.45)}
.wx-rays{position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,230,140,.22) 0 8deg,transparent 8deg 22deg);animation:wxSpin 40s linear infinite;-webkit-mask:radial-gradient(circle,#000 35%,transparent 70%);mask:radial-gradient(circle,#000 35%,transparent 70%)}
@keyframes wxSpin{to{transform:rotate(360deg)}}
.wx-heat .wx-sun::before{background:radial-gradient(circle,#FFF2B0,#FF7A2A);box-shadow:0 0 90px 45px rgba(255,110,40,.55)}
.wx-haze{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,170,90,.06) 0 6px,transparent 6px 14px);animation:wxHaze 2.4s ease-in-out infinite alternate;filter:blur(2px)}
@keyframes wxHaze{from{transform:translateY(0) skewX(0)}to{transform:translateY(-6px) skewX(1.5deg)}}
.wx-cloud{position:absolute;right:-200px;width:180px;height:56px;border-radius:40px;background:rgba(220,228,245,.18);filter:blur(1px);animation:wxDrift linear infinite}
.wx-cloud::before,.wx-cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.wx-cloud::before{width:80px;height:80px;top:-36px;right:30px}.wx-cloud::after{width:60px;height:60px;top:-24px;right:92px}
.wx-lRain .wx-cloud,.wx-hRain .wx-cloud{background:rgba(120,132,160,.35)}
@keyframes wxDrift{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 420px))}}
.wx-rain{position:absolute;inset:-20% 0 0;background-image:repeating-linear-gradient(105deg,transparent 0 9px,rgba(190,215,255,.32) 9px 10px,transparent 10px 22px);background-size:120px 120px;animation:wxRain .45s linear infinite}
.wx-rain.far{opacity:.45;background-size:70px 70px;animation-duration:.7s}
.wx-rain.heavy{background-image:repeating-linear-gradient(105deg,transparent 0 5px,rgba(200,220,255,.45) 5px 6px,transparent 6px 13px)}
@keyframes wxRain{to{background-position:-30px 120px}}
.wx-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:wxFlash 7s infinite}
@keyframes wxFlash{0%,92%,100%{opacity:0}93%{opacity:.35}94%{opacity:0}95.5%{opacity:.25}96.5%{opacity:0}}
.wx-snow{position:absolute;top:-10px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.85);animation:wxSnow linear infinite}
@keyframes wxSnow{to{transform:translate(30px,105vh)}}
/* Dawn transition matches the day's weather */
.sky .wx{z-index:0}.sky .sky-text{z-index:2}
.sky-dawn.sky-w-lRain,.sky-dawn.sky-w-hRain{background:linear-gradient(180deg,#4A566E,#7D8AA3 60%,#A9B3C4)}
.sky-dawn.sky-w-cloudy{background:linear-gradient(180deg,#7C8BA6,#B3BFD3 60%,#E2E6EE)}
.sky-dawn.sky-w-cold{background:linear-gradient(180deg,#8FB4E0,#C9DDF5 60%,#F0F6FF)}
.sky-dawn.sky-w-hot,.sky-dawn.sky-w-heat{background:linear-gradient(180deg,#FF8A3D,#FFB15A 50%,#FFE0A0)}
.sky-dawn.sky-w-lRain .sky-orb,.sky-dawn.sky-w-hRain .sky-orb,.sky-dawn.sky-w-cloudy .sky-orb{opacity:.35}
.sky-dawn.sky-w-lRain .sky-text,.sky-dawn.sky-w-hRain .sky-text{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.4)}

/* ── Control center ── */
.hub-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hub-head p{margin:4px 0 0;color:var(--dim);font-size:13px;line-height:1.45}
.hub-ring{flex-shrink:0;width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#1D3326 60%,transparent 61%),conic-gradient(var(--good) 0 100%);box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.hub-ring.warn{background:radial-gradient(circle,#2E2516 60%,transparent 61%),conic-gradient(var(--warn) 0 100%);box-shadow:0 0 0 3px rgba(251,191,36,.25)}
.hub-ring b{font-size:20px}.hub-ring small{font-size:10px;color:var(--dim)}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:right;border-radius:14px;padding:10px 12px;border:1px solid var(--line);border-inline-start:4px solid var(--line)}
.task.ok{border-inline-start-color:var(--good)}.task.opt{border-inline-start-color:var(--line)}
.task.warn{border-inline-start-color:var(--warn);background:linear-gradient(90deg,rgba(58,48,18,.95),rgba(28,31,56,.92))}
.task.bad{border-inline-start-color:var(--bad);background:linear-gradient(90deg,rgba(61,30,40,.95),rgba(28,31,56,.92))}
.tk-ic{font-size:24px;text-align:center}
.tk-tx{display:flex;flex-direction:column;min-width:0}
.tk-tx b{font-size:14.5px}.tk-tx span{font-size:12.5px;color:var(--dim);margin-top:1px}
.tk-tx em{font-style:normal;font-size:12px;font-weight:600;margin-top:3px;color:var(--warn)}
.task.bad .tk-tx em{color:var(--bad)}
.tk-st{font-size:13px;font-weight:700;white-space:nowrap}
.task.ok .tk-st{color:var(--good)}.task.opt .tk-st{color:var(--dim);font-size:11.5px}.task.warn .tk-st{color:var(--warn)}.task.bad .tk-st{color:var(--bad)}
.feed .cl-h{padding:6px 2px}
.chip.back{background:rgba(28,31,56,.92)}
.dlg p{white-space:pre-line}

/* ── Place banners: each section has its own atmosphere ── */
.banner{position:relative;overflow:hidden;border-radius:16px;padding:14px 14px;min-height:74px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid rgba(255,255,255,.12)}
.bn-deco{position:absolute;inset:0;pointer-events:none}
.bn-tx{position:relative;display:flex;align-items:center;gap:10px}
.bn-ic{font-size:32px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.bn-tx b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600}
.bn-tx span{font-size:12px;opacity:.85}
.bn-back{position:relative;background:rgba(0,0,0,.35);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.bn-market{background:linear-gradient(180deg,#3B1C4A,#5A2440)}
.bn-market .bn-deco{background:radial-gradient(circle,#FFD86B 0 3px,transparent 4px) 0 6px/30px 14px repeat-x,linear-gradient(170deg,transparent 40%,rgba(255,170,60,.18))}
.bn-market .bn-deco::after{content:"";position:absolute;inset:0 0 auto;height:14px;background:radial-gradient(circle,rgba(255,216,107,.55) 0 6px,transparent 9px) 0 6px/30px 14px repeat-x;animation:bulbs 1.6s ease-in-out infinite alternate}
@keyframes bulbs{from{opacity:.3}to{opacity:1}}
.bn-store{background:repeating-linear-gradient(0deg,#5A3A22 0 18px,#4A2F1B 18px 20px)}
.bn-kitchen{background:linear-gradient(135deg,#1F5F5B,#2A7A6F)}
.bn-kitchen .bn-deco{background:repeating-conic-gradient(rgba(255,255,255,.07) 0 25%,transparent 0 50%) 0 0/22px 22px}
.bn-ads{background:linear-gradient(135deg,#B8326B,#F07A2A)}
.bn-ads .bn-deco{background:repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px)}
.bn-spy{background:#0E2A1F}
.bn-spy .bn-deco{background:radial-gradient(circle at 80% 30%,rgba(190,255,200,.25),transparent 45%)}
.bn-biz{background:linear-gradient(180deg,#8A5A1E,#5C3A12)}
.bn-biz .bn-deco{background:repeating-linear-gradient(90deg,#FFD23F 0 22px,#FFF6D6 22px 44px) 0 0/100% 10px no-repeat;opacity:.9}

/* ── Night market stalls ── */
.stalls{display:flex;flex-direction:column;gap:10px}
.stall{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#6B4426,#4E3019);box-shadow:0 6px 18px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08)}
.stall.on{box-shadow:0 0 0 2px var(--good),0 6px 18px rgba(0,0,0,.35)}
.awning{height:16px;background:repeating-linear-gradient(90deg,var(--aw1) 0 22px,var(--aw2) 22px 44px);-webkit-mask:radial-gradient(circle at 11px 100%,transparent 6px,#000 7px) 0 0/22px 100%;mask:radial-gradient(circle at 11px 100%,transparent 6px,#000 7px) 0 0/22px 100%}
.st-lemon{--aw1:#FFD23F;--aw2:#FFF6D6}.st-sugar{--aw1:#FF8FB1;--aw2:#FFE4EE}.st-ice{--aw1:#5CC8F0;--aw2:#E3F7FF}
.stall-body{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px 4px}
.crate{font-size:18px;letter-spacing:-6px;background:#3A2312;border-radius:8px;padding:6px 10px 6px 14px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.stall-info b{display:block;font-size:15px}.stall-info span{font-size:12px;color:#E8D6C3}
.tag-price{background:#20261F;border:2px solid #C9B48A;color:#F3F1E8;border-radius:8px;padding:4px 8px;font-size:16px;font-weight:600;text-align:center;transform:rotate(-3deg);display:flex;flex-direction:column;line-height:1.1}
.tag-price small{font-size:10.5px;font-weight:500}.tag-price small.up{color:var(--bad)}.tag-price small.dn{color:var(--good)}
.stall-buy{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 10px}
.stall-sum{font-size:14px;color:var(--lemon)}

/* ── Inventory ── */
.inv-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.inv-c{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--panel-2);border-radius:12px;padding:8px 4px;text-align:center}
.inv-c span{font-size:22px}.inv-c b{font-size:22px}.inv-c small{font-size:11.5px;color:var(--dim)}
.inv-c em{font-style:normal;font-size:10.5px;color:var(--warn);margin-top:2px}
.rtable{display:flex;flex-direction:column;gap:5px}
.rt-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;text-align:right;background:var(--panel-2);border-radius:11px;padding:8px 10px;border:1px solid transparent}
.rt-row.mine{border-color:var(--lemon);background:#2E2A12}
.rt-row .rt-n{display:flex;flex-direction:column;min-width:0}.rt-row .rt-n b{font-size:13.5px}.rt-row .rt-n small{font-size:11.5px;color:var(--dim)}
.rt-cups{font-size:12px;color:var(--dim);white-space:nowrap}.rt-cups b{font-size:18px;color:var(--ink)}
.rt-lim{font-size:11px;color:var(--dim);white-space:nowrap}

/* ── Recipe presets ── */
.presets{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.presets::-webkit-scrollbar{display:none}
.preset{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:6px 10px;text-align:right}
.preset b{font-size:12.5px}.preset small{font-size:10.5px;color:var(--dim)}
.preset.on{border-color:var(--lemon);background:#2E2A12}
/* Sugar crystals sparkle in the drink */
.glass-spark{animation:spark 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spark{0%,100%{opacity:.25}50%{opacity:1}}

/* Six places in the cup */
.slots-wrap{background:var(--panel-2);border-radius:12px;padding:8px;margin-bottom:10px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:10px;padding:6px 0 4px;border:2px solid transparent;transition:background .25s,border-color .25s;animation:slotIn .3s var(--spring)}
@keyframes slotIn{from{transform:scale(.8)}}
.slot b{font-size:20px;line-height:1}.slot small{font-size:10px;font-weight:600}
.s-l{background:#4A3D0E;border-color:#FFD23F;color:#FFE58A}
.s-h{background:#4A2234;border-color:#FF8FB1;color:#FFC2D6}
.s-i{background:#163A4E;border-color:#5CC8F0;color:#BDEBFF}
.s-w{background:transparent;border:2px dashed #4A507E;color:var(--dim)}
.s-w b{opacity:.5}
.slots-cap{font-size:12px;color:var(--dim);margin-top:7px;text-align:center;line-height:1.4}
.slots-cap b{color:var(--ink);font-size:14px}
.slots-cap.full{color:var(--warn)}

/* Glass with its measuring column */
.recipe{grid-template-columns:150px minmax(0,1fr)}
.glass{width:150px}
@media (max-width:380px){.recipe{grid-template-columns:128px minmax(0,1fr)}.glass{width:128px}}
.gauge-cell{animation:slotIn .3s var(--spring) both}
.glass-wrap{flex-direction:column;gap:2px;padding-bottom:6px}
.glass-cap{font-size:11px;color:var(--dim);text-align:center;line-height:1.3;padding:0 4px}
.glass-cap.full{color:var(--warn);font-weight:600}
.rt-badge{font-style:normal;font-size:10.5px;font-weight:700;background:var(--lemon);color:var(--lemon-ink);padding:1px 6px;border-radius:6px;margin-inline-end:6px}

/* Title and setup */
.intro{justify-content:center}
.intro-in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px max(16px,env(safe-area-inset-left,0px));text-align:center;overflow-y:auto;max-height:100%}
.intro-glass .glass{width:170px;animation:heroBob 4s ease-in-out infinite}
@keyframes heroBob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.intro-title{font-family:var(--f-display);font-size:44px;font-weight:600;margin:0;color:var(--lemon);text-shadow:0 4px 24px rgba(255,210,63,.35)}
.intro-sub{margin:0;color:var(--dim);font-size:15px}
.intro-pts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-bottom:6px}
.intro-pts span{background:rgba(28,31,56,.9);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.intro .cta{max-width:340px}
.setup{align-items:stretch;text-align:right;width:100%;max-width:460px;margin:0 auto}
.setup h2{font-size:26px;text-align:center}
.locs.two{grid-template-columns:1fr 1fr}
.intro-btns{display:flex;gap:8px;align-items:center;margin-top:6px}
.intro-btns .cta{flex:1}

/* Rivals */
.locs.four{grid-template-columns:repeat(4,1fr)}
.rivals{display:flex;flex-direction:column;gap:5px}
.rival{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel-2);border-radius:11px;padding:7px 10px}
.rv-x{font-size:12.5px;font-weight:600;color:var(--lemon);white-space:nowrap}
.lb{display:grid;grid-template-columns:24px minmax(0,1fr) auto 64px;gap:8px;align-items:center;font-size:13px;padding:6px 4px;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:none}
.lb.me{background:#2E2A12;border-radius:8px}
.lb-r{font-weight:700;color:var(--dim)}.lb-s{font-size:11.5px;color:var(--dim)}.lb b{text-align:left}

/* ── Motion round 1 ── */
/* Things flying to the HUD, and the HUD reacting */
.flyer{position:fixed;z-index:300;pointer-events:none;font-size:22px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.hit{animation:hit .45s var(--spring)}
@keyframes hit{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
.roll{display:inline-block}
/* Glass reactions */
.fx-drop{animation:fxDrop .55s cubic-bezier(.5,0,.75,0) forwards;transform-box:fill-box}
@keyframes fxDrop{from{transform:translateY(-30px);opacity:0}15%{opacity:1}to{transform:translateY(62px);opacity:0}}
.fx-sugar{animation:fxSugar .7s ease-in forwards;opacity:0}
@keyframes fxSugar{from{transform:translateY(0);opacity:1}to{transform:translateY(80px);opacity:0}}
.fx-splash{opacity:0;animation:fxSplash .6s ease-out .45s forwards;transform-box:fill-box;transform-origin:center}
@keyframes fxSplash{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(3.2)}}
.fx-out{animation:fxOut .8s var(--ease-out) forwards}
@keyframes fxOut{from{transform:translateY(0);opacity:1}to{transform:translateY(-55px) rotate(25deg);opacity:0}}
.surf-wobble{animation:wobble .7s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes wobble{0%{transform:scaleY(1)}25%{transform:scaleY(1.9) translateY(-1px)}50%{transform:scaleY(.6)}75%{transform:scaleY(1.3)}100%{transform:scaleY(1)}}
/* Opening the stand */
.sky-open{background:radial-gradient(circle at 50% 40%,#FFE9A8,#FFB84C 55%,#E2852B)}
.op-stand{position:absolute;top:22%;left:50%;transform:translateX(-50%);width:210px;text-align:center}
.op-awning{height:46px;border-radius:14px 14px 0 0;background:repeating-linear-gradient(90deg,#FFD23F 0 26px,#fff 26px 52px);transform-origin:top;animation:awning .7s var(--spring) both;box-shadow:0 6px 0 rgba(0,0,0,.15)}
@keyframes awning{from{transform:scaleY(0)}}
.op-body{background:linear-gradient(180deg,#8A5A2B,#5E3A18);height:120px;border-radius:0 0 12px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;perspective:400px}
.op-sign{position:relative;width:120px;height:44px;transform-style:preserve-3d;animation:flip .6s ease-in-out .6s both}
.op-sign span{position:absolute;inset:0;display:grid;place-items:center;border-radius:10px;font-family:var(--f-display);font-weight:600;font-size:22px;backface-visibility:hidden}
.op-front{background:#B4404A;color:#fff}.op-back{background:#2F9E5B;color:#fff;transform:rotateY(180deg)}
@keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.op-cups{font-size:22px;letter-spacing:4px;animation:pop .4s var(--spring) .9s both}
.sky-open .sky-text{margin-top:240px;color:#3A2100;text-shadow:0 2px 12px rgba(255,255,255,.5)}
/* End-of-day register */
.rp-hero{position:relative;overflow:hidden}
.rp-coins span{position:absolute;top:-30px;font-size:20px;animation:coinFall 1s cubic-bezier(.5,0,.6,1) both}
@keyframes coinFall{from{transform:translateY(0) rotate(0);opacity:0}20%{opacity:1}to{transform:translateY(190px) rotate(540deg);opacity:0}}
.register{display:inline-block;animation:ring .5s ease-in-out 1.1s 2}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.confetti i{position:absolute;top:-12px;width:7px;height:12px;border-radius:2px;animation:conf 1.8s ease-in forwards}
@keyframes conf{from{transform:translateY(0) rotate(0);opacity:1}to{transform:translateY(260px) rotate(720deg);opacity:0}}
.rp-grid>div{animation:pop .4s var(--spring) both}
.rp-grid>div:nth-child(2){animation-delay:.08s}.rp-grid>div:nth-child(3){animation-delay:.16s}.rp-grid>div:nth-child(4){animation-delay:.24s}
/* Control center */
.hub-ring{background:radial-gradient(circle,#1D3326 60%,transparent 61%),conic-gradient(var(--good) 0 var(--p,100%),rgba(255,255,255,.12) var(--p,100%) 100%)}
.hub-ring.warn{background:radial-gradient(circle,#2E2516 60%,transparent 61%),conic-gradient(var(--warn) 0 var(--p,100%),rgba(255,255,255,.12) var(--p,100%) 100%)}
.tk-st{display:inline-block;animation:pop .35s var(--spring)}
.ready{display:flex;justify-content:center;align-items:center;gap:8px;background:linear-gradient(90deg,#1D3326,#255C3A,#1D3326);border:1px solid #2F6B47;border-radius:12px;padding:8px;font-family:var(--f-display);font-size:17px;color:var(--good);animation:pop .5s var(--spring)}
.ready span{animation:twinkle 1s ease-in-out infinite alternate}
/* Tabs slide in from the direction you moved; the nav icon hops */
.main.from-l{animation:slideL .32s var(--ease-out)}.main.from-r{animation:slideR .32s var(--ease-out)}
@keyframes slideL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.nav button.on span{animation:navHop .45s var(--spring)}
@keyframes navHop{0%{transform:scale(1)}40%{transform:scale(1.35) translateY(-4px)}100%{transform:scale(1.12)}}

/* Marketing extras on the stand (opening + install overlays) */
.sky-install{background:radial-gradient(circle at 50% 40%,#D6F5FF,#7FC8F0 55%,#4B8FD1)}
.sky-install .op-awning{animation:none}
.sky-install .sky-text{margin-top:240px;color:#0E2A4A;text-shadow:0 2px 12px rgba(255,255,255,.5)}
.op-stand{position:absolute}
.sa-sign{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:#FFF8DC;color:#8A5A00;border:3px solid #B07A44;border-radius:10px;padding:5px 14px;font-family:var(--f-display);font-weight:600;font-size:19px;box-shadow:0 0 0 3px #FFE14D,0 0 18px #FFE14D;animation:bulbs 1s steps(2) infinite}
.sa-shade{position:absolute;bottom:0;right:-92px}
.op-cups{position:relative}
.bcup{display:inline-grid;place-items:center;width:22px;height:28px;margin:0 3px;background:linear-gradient(#FFE14D,#F2B800);clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);font-size:12px;letter-spacing:0}
.fresh{animation:saDrop .9s var(--spring) .25s both}
.sa-sign.fresh{animation:saDropC .9s var(--spring) .25s both,bulbs 1s steps(2) 1.2s infinite}
.sa-spark{position:absolute;top:-14px;right:-14px;font-style:normal;font-size:22px;animation:sparkle .7s ease-out 1s 3 both}
@keyframes saDrop{from{transform:translateY(-220px) rotate(-8deg);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
@keyframes saDropC{from{transform:translate(-50%,-220px) rotate(-8deg);opacity:0}60%{opacity:1}to{transform:translateX(-50%);opacity:1}}
@keyframes sparkle{0%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1.3) rotate(20deg);opacity:1}100%{transform:scale(.6) rotate(40deg);opacity:0}}
@keyframes bulbs{0%{box-shadow:0 0 0 3px #FFE14D,0 0 18px #FFE14D}100%{box-shadow:0 0 0 3px #FF9F1C,0 0 8px #FF9F1C}}
.lnk{color:var(--lemon);text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){.fresh,.sa-sign,.sa-spark{animation:none!important}}

/* ── Motion round 2: events ── */
.sky-ev{flex-direction:column;justify-content:flex-start;padding-top:16vh}
.sky-vip,.sky-insp,.sky-paper{animation-duration:2.9s}.sky-helper{animation-duration:2.6s}
.sky-vip{background:linear-gradient(180deg,#2B2F6B,#5B4A9E 55%,#D9A441)}
.sky-insp{background:linear-gradient(180deg,#24364A,#3E5A72 60%,#6E8AA0)}
.sky-paper{background:radial-gradient(circle at 50% 40%,#FFF6D6,#F2D38A 60%,#C99A3E)}
.sky-helper{background:linear-gradient(180deg,#1F5F5B,#3FA08F 60%,#9FE0C8)}
.sky-ev .sky-text{margin-top:18px}
.sky-paper .sky-text{color:#3A2100;text-shadow:0 2px 12px rgba(255,255,255,.5)}
.ev-stage{position:relative;width:300px;height:200px}
.ev-road{position:absolute;left:-40px;right:-40px;bottom:18px;height:10px;border-radius:5px;background:rgba(0,0,0,.25)}
.ev-taxi{position:absolute;bottom:20px;left:50%;font-size:96px;line-height:1;margin-left:-48px;animation:taxiIn 1s cubic-bezier(.2,.8,.3,1.15) both}
@keyframes taxiIn{from{transform:translateX(110vw)}70%{transform:translateX(-12px)}to{transform:none}}
.ev-who{position:absolute;bottom:40px;left:18%;font-size:56px;animation:popUp .5s var(--spring) .95s both}
.ev-hat{position:absolute;top:-30px;left:6px;font-style:normal;font-size:38px;animation:tip .6s ease-in-out 1.6s 2}
@keyframes tip{50%{transform:translateY(-8px) rotate(-14deg)}}
.ev-note{position:absolute;bottom:56px;left:2%;font-size:30px;animation:popUp .4s var(--spring) 1.2s both}
.ev-star{position:absolute;top:6px;font-size:26px;animation:popUp .4s var(--spring) both}
@keyframes popUp{from{transform:translateY(30px) scale(.3);opacity:0}to{transform:none;opacity:1}}
.ev-walker{position:absolute;bottom:20px;left:8%;font-size:76px;animation:walkIn 1s ease-out both,bob .25s ease-in-out 4 alternate}
@keyframes walkIn{from{transform:translateX(-80vw)}to{transform:none}}
@keyframes bob{to{translate:0 -6px}}
.ev-pad{position:absolute;right:8%;bottom:30px;width:130px;height:150px;background:#FFFDF2;border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.3);padding:12px;display:flex;flex-direction:column;gap:10px;color:#24364A;animation:popUp .4s var(--spring) .6s both}
.ev-pad b{font-size:14px}.ev-pad i{display:block;height:4px;border-radius:2px;background:#9BB0C2;transform-origin:right;animation:line .3s ease-out both}
.ev-pad i:nth-of-type(1){animation-delay:.9s}.ev-pad i:nth-of-type(2){animation-delay:1.05s;width:70%}.ev-pad i:nth-of-type(3){animation-delay:1.2s;width:85%}
@keyframes line{from{transform:scaleX(0)}}
.ev-pen{position:absolute;left:10px;top:40px;font-size:28px;animation:scrib .15s ease-in-out .9s 6 alternate}
@keyframes scrib{to{transform:translate(10px,6px) rotate(-10deg)}}
.ev-stamp{position:absolute;right:4%;bottom:70px;transform:rotate(-14deg);border:4px solid #D62B3A;color:#D62B3A;font-family:var(--f-display);font-weight:600;font-size:24px;padding:2px 10px;border-radius:8px;background:rgba(255,255,255,.6);animation:stampIn .35s cubic-bezier(.5,0,.75,0) 1.25s both}
@keyframes stampIn{from{transform:scale(3) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-14deg);opacity:1}}
.ev-news{position:absolute;left:50%;top:0;width:240px;margin-left:-120px;background:#FBF8EE;color:#222;border-radius:4px;padding:10px 12px;box-shadow:0 14px 30px rgba(0,0,0,.35);animation:spinIn 1.1s cubic-bezier(.2,.8,.3,1) both}
@keyframes spinIn{from{transform:scale(0) rotate(-900deg)}to{transform:scale(1) rotate(-4deg)}}
.nw-mast{font-family:var(--f-display);font-weight:600;font-size:13px;border-bottom:2px solid #222;padding-bottom:4px;text-align:center}
.nw-head{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1;margin:8px 0;text-align:center}
.nw-body{display:flex;gap:10px;align-items:center}.nw-body span{font-size:46px;background:#FFE58A;border-radius:6px;padding:4px}
.nw-body p{flex:1;margin:0;display:flex;flex-direction:column;gap:6px}.nw-body i{display:block;height:4px;background:#C9C3B0;border-radius:2px}
.ev-walker.hp{left:30%}
.ev-wave{position:absolute;bottom:90px;left:58%;font-size:40px;transform-origin:70% 90%;animation:popUp .3s var(--spring) .9s both,wave .4s ease-in-out 1.2s 4 alternate}
@keyframes wave{from{rotate:-20deg}to{rotate:20deg}}
.ev-bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#1F5F5B;font-weight:700;border-radius:14px;padding:6px 12px;animation:popUp .4s var(--spring) 1.1s both}
/* Intel reveals */
.fc-card{position:relative;overflow:hidden}
.fc-ball{display:none}
.fc-card.reveal .fc-ball{display:grid;place-items:center;position:absolute;inset:0;font-size:64px;background:radial-gradient(circle,rgba(160,120,255,.55),rgba(42,47,99,.95) 70%);animation:ball 1.3s ease-in-out both;z-index:1}
@keyframes ball{0%{opacity:1;transform:scale(.6) rotate(0)}60%{opacity:1;transform:scale(1.1) rotate(200deg);filter:blur(0)}100%{opacity:0;transform:scale(1.6) rotate(360deg);filter:blur(6px)}}
.fc-card.reveal>:not(.fc-ball){animation:unblur .7s ease-out .9s both}
@keyframes unblur{from{filter:blur(8px);opacity:0}}
.aud-r.grow .aud-b i{transform-origin:right;animation:barGrow .8s var(--ease-out) var(--d,0s) both}
@keyframes barGrow{from{transform:scaleX(0)}}
.aud-r.grow .aud-x b{display:inline-block;animation:pop .4s var(--spring) calc(var(--d,0s) + .5s) both}
.rivals{position:relative}
.rivals.scan .rv-x{animation:popUp .4s var(--spring) var(--d,.5s) both}
.scan-bino{position:absolute;z-index:2;right:0;top:0;font-size:30px;pointer-events:none;animation:scan 1.5s ease-in-out both}
@keyframes scan{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(-240px,40%)}90%{opacity:1}100%{transform:translate(-40px,100%);opacity:0}}
/* ── Settings ── */
.gear{width:36px;height:36px;border-radius:10px;background:rgba(0,0,0,.25);font-size:18px;display:grid;place-items:center;flex-shrink:0}
.gear:active{transform:rotate(60deg)}
.t-side{display:flex;align-items:center;gap:8px}
.intro-gear{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:16px;z-index:3}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;max-width:420px;max-height:88%;display:flex;flex-direction:column;animation:pop .3s var(--spring)}
.sheet-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h2{flex:1;font-size:20px}
.sheet-x{width:32px;height:32px;border-radius:9px;background:var(--panel-2);font-size:14px}
.sheet-b{overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:6px}
.set-grp{background:var(--panel-2);border-radius:14px;overflow:hidden}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 12px;text-align:right;border-bottom:1px solid var(--line)}
.set-grp>:last-child{border-bottom:none}
.set-t{display:flex;flex-direction:column;min-width:0}.set-t b{font-size:14.5px}.set-t small{font-size:12px;color:var(--dim)}
.set-go{color:var(--dim);font-size:18px}
.tgl{width:46px;height:28px;border-radius:14px;background:#454A75;position:relative;flex-shrink:0;transition:background .2s}
.tgl i{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s var(--spring)}
.tgl.on{background:var(--good)}.tgl.on i{transform:translateX(-18px)}
.vol input{flex:1;max-width:170px;accent-color:var(--lemon)}
.set-quit{margin-top:12px}
.set-ver{text-align:center;font-size:11.5px;color:var(--dim);margin-top:8px}
.legal p{margin:0 0 6px;font-size:14px;line-height:1.6;color:var(--ink)}
.legal h4{margin:10px 0 2px;font-size:15px;color:var(--lemon)}
.legal .btn{margin-top:10px}
/* Accessibility switches */
html.reduce *,html.reduce *::before,html.reduce *::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
html.big .app,html.big .dlg-bg{zoom:1.15}
html.hc{--dim:#DADCF0;--line:#7C82B8;--panel:#0E1024;--panel-2:#1A1D3A}
html.hc .blk,html.hc .task,html.hc .msg{background-color:#0E1024!important;border-color:#7C82B8}
html.hc .tag,html.hc .why{outline:1px solid currentColor}

/* Weather card on the control center */
.wcard{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:right;width:100%;border-radius:16px;padding:12px;background:linear-gradient(150deg,#2A4F8A,#3B2A6B);border:1px solid rgba(255,255,255,.14);animation:pop .4s var(--spring)}
.wcard.none{background:linear-gradient(150deg,#2A2F4A,#22263E);border-style:dashed}
.wc-e{font-size:42px;text-align:center;line-height:1}
.wc-t{display:flex;flex-direction:column;min-width:0}
.wc-t small{font-size:11.5px;color:rgba(255,255,255,.75);font-weight:600}
.wc-t b{font-family:var(--f-display);font-size:22px;font-weight:600}
.wc-t span{font-size:12.5px;color:var(--dim)}
.wc-go{font-size:12.5px;font-weight:700;color:var(--lemon);white-space:nowrap}

/* ── Dashboard ── */
.dash{position:absolute;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;animation:slideUp .3s var(--ease-out)}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}}
.dash .sheet-h{padding:12px max(16px,env(safe-area-inset-left,0px));background:rgba(28,31,56,.95)}
.dash-b{flex:1;min-height:0;overflow-y:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 24px;display:flex;flex-direction:column;gap:12px}
.dtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dtiles>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;min-width:0}
.dtiles small{font-size:11px;color:var(--dim)}.dtiles b{font-size:19px;font-weight:600}.dtiles b i{font-size:12px;color:var(--dim);font-style:normal}.dtiles>div>i{font-style:normal;font-size:10.5px;color:var(--dim)}
.dbest{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;background:var(--panel);border-radius:12px;padding:8px}
.dbest em{font-style:normal;font-weight:600}
.dchart{width:100%;height:auto;display:block;margin:2px 0}
.dgrid{stroke:rgba(255,255,255,.08);stroke-width:1}.dzero{stroke:rgba(255,255,255,.35);stroke-width:1;stroke-dasharray:3 3}
.dax{font-size:9px;fill:var(--dim);font-family:var(--f-body)}
.dleg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:11.5px;color:var(--dim);margin-bottom:6px}
.dleg span{display:flex;align-items:center;gap:4px}.dleg i{width:12px;height:4px;border-radius:2px;display:inline-block}
.dtbl{overflow-x:auto;margin:0 -4px 6px}
.dtbl table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}
.dtbl th{font-size:10.5px;color:var(--dim);font-weight:700;padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.dtbl td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.dtbl tr.me td{background:#2E2A12}
.dtbl .dn{text-align:right;white-space:nowrap;font-weight:600}.dtbl .nw{white-space:nowrap;font-size:11px}
.dbars{display:flex;flex-direction:column;gap:6px}
.dbar{display:grid;grid-template-columns:96px minmax(0,1fr) 84px;gap:8px;align-items:center;font-size:12.5px}
.dbar i{height:10px;background:var(--night);border-radius:5px;overflow:hidden}.dbar b{display:block;height:100%;background:linear-gradient(90deg,#FB7185,#FBBF24);border-radius:5px}
.dbar em{font-style:normal;font-size:11.5px;color:var(--dim);text-align:left}
.dpct{font-size:12px;color:var(--dim);text-align:center}
.dwx{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.dwx>div{display:flex;flex-direction:column;align-items:center;background:var(--panel-2);border-radius:10px;padding:5px 2px;border-bottom:3px solid var(--good)}
.dwx>div.neg{border-bottom-color:var(--bad)}
.dwx i{font-style:normal;font-size:10.5px;color:var(--dim)}.dwx span{font-size:20px}.dwx b{font-size:13px}.dwx small{font-size:10.5px;color:var(--dim)}
.dlog{display:grid;grid-template-columns:48px 1fr;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.dlog span{color:var(--dim)}

/* ── Tutorial spotlights ── */
.coach{position:fixed;inset:0;z-index:90;pointer-events:none}
.coach-hole{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(5,6,15,.72),0 0 0 3px var(--lemon),0 0 24px 6px rgba(255,210,63,.5);transition:all .35s var(--ease-out);animation:pulseRing 1.4s ease-in-out infinite}
@keyframes pulseRing{50%{box-shadow:0 0 0 9999px rgba(5,6,15,.72),0 0 0 5px var(--lemon),0 0 30px 10px rgba(255,210,63,.6)}}
.coach-dim{position:fixed;inset:0;background:rgba(5,6,15,.72)}
.coach-tip{position:fixed;left:16px;right:16px;max-width:420px;margin:0 auto;pointer-events:auto;background:var(--panel);border:2px solid var(--lemon);border-radius:16px;padding:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:pop .3s var(--spring)}
.coach-tip b{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--lemon)}
.coach-tip p{margin:6px 0 12px;font-size:14px;line-height:1.55}
.coach-b{display:flex;align-items:center;gap:8px}
.coach-n{flex:1;font-size:12px;color:var(--dim)}

.coach-tip.welcome{text-align:center;bottom:auto!important;top:50%!important;transform:translateY(-50%);animation:none}
.coach-tip.welcome b{font-size:24px;display:block}
.coach-tip.welcome p{white-space:pre-line;font-size:15px}
.coach-tip.welcome .coach-b{justify-content:center}.coach-tip.welcome .coach-n{display:none}

/* ── The ending ── */
.fin-hero{padding:22px 12px 18px;background:linear-gradient(170deg,#3B2A6B,#7A3E5E 55%,#D9773E)}
.fin-rank{display:flex;flex-direction:column;align-items:center;margin:8px 0 2px;animation:popUp .6s var(--spring) .2s both}
.fin-rank span{font-size:54px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));animation:heroBob 3s ease-in-out 1s infinite}
.fin-rank b{font-family:var(--f-display);font-size:28px;font-weight:600;color:#FFE58A;text-shadow:0 2px 14px rgba(255,210,63,.5)}
.fin-pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;padding-top:8px;min-height:190px}
.pod-col{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center}
.pod-who{display:flex;flex-direction:column;align-items:center;margin-bottom:6px;text-align:center;animation:popUp .5s var(--spring) both}
.pod-who span{font-size:34px}.pod-who b{font-size:12.5px}.pod-who i{font-style:normal;font-size:13px;color:var(--lemon)}
.pod-bar{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:start center;padding-top:6px;transform-origin:bottom;animation:grow .7s var(--ease-out) both;background:linear-gradient(180deg,#5A608F,#353A63)}
.pod-bar b{font-family:var(--f-display);font-size:24px;font-weight:600;color:rgba(255,255,255,.85)}
.pod-col.p1 .pod-bar{background:linear-gradient(180deg,#FFD23F,#C9971B)}.pod-col.p1 .pod-bar b{color:#4A3500}
.pod-col.p2 .pod-bar{background:linear-gradient(180deg,#D9DCEB,#9AA0BC)}.pod-col.p2 .pod-bar b{color:#2A2E4A}
.pod-col.p3 .pod-bar{background:linear-gradient(180deg,#E5A26B,#A8633A)}
.pod-col.me .pod-bar{box-shadow:0 0 0 3px var(--lemon),0 0 22px rgba(255,210,63,.55)}
.pod-col.me .pod-who b{color:var(--lemon)}
.pod-rest{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:13px;color:var(--dim)}.pod-rest .me{color:var(--lemon)}
.fx-recs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fx-rec{position:relative;background:var(--panel-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;overflow:hidden;animation:popUp .45s var(--spring) both}
.fx-rec small{font-size:12px;color:var(--dim)}.fx-rec b{font-size:22px;font-weight:600}.fx-rec i{font-style:normal;font-size:11px;color:var(--dim)}
.fx-rec.new{background:linear-gradient(150deg,#3A3012,#252949);box-shadow:inset 0 0 0 2px var(--lemon)}
.fx-rec.new::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-120%);animation:shine 1.6s ease-in-out 3.2s 2}
@keyframes shine{to{transform:translateX(120%)}}
.fx-ribbon{align-self:flex-start;font-size:10.5px;font-weight:700;background:var(--lemon);color:var(--lemon-ink);border-radius:6px;padding:1px 6px;margin-bottom:3px}
.fin-facts{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-size:12.5px;color:var(--dim);margin-top:10px}

/* Rivals' day */
.rv-day{display:flex;flex-direction:column;gap:1px;padding:6px 2px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px}
.rv-day:last-of-type{border-bottom:none}.rv-day span{color:var(--dim)}.rv-day em{font-style:normal;color:var(--lemon);font-size:12px}
.rival{grid-template-columns:34px minmax(0,1fr) auto}
.rv-plan{grid-column:1/-1;font-size:11.5px;color:var(--dim);line-height:1.5}.rv-plan b{color:var(--bad)}

/* Community records */
.cb-p{margin:0 0 8px;font-size:13px;color:var(--dim);line-height:1.5}
.cb-row{display:flex;gap:8px}
.cb-in{flex:1;min-width:0;background:var(--night);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:15px;padding:8px 10px}
.cb-in:focus{outline:2px solid var(--lemon);outline-offset:1px}
.cb-rank{text-align:center;font-size:14px;margin-bottom:8px}.cb-rank b{color:var(--lemon);font-size:20px}
.cb-f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip.on{border-color:var(--lemon);background:#2E2A12;color:var(--lemon)}
.intro .btn.ghost{max-width:340px;width:100%}

/* Setup: the start button takes the width, back stays small */
.intro-btns .btn.ghost{width:auto;flex:0 0 auto;max-width:none}
.intro-btns .cta{flex:1;max-width:none}
/* Long sheets scroll instead of squeezing their rows */
.sheet-b>*,.dash-b>*{flex-shrink:0}
/* ── Street event scenes ── */
.sky-event.good{background:linear-gradient(180deg,#2B5FA8,#6A8FE0 55%,#F2C66B)}
.sky-event.bad{background:linear-gradient(180deg,#2E3448,#4A5470 60%,#7A7F95)}
.sky-event .ev-stage{overflow:visible}
.evm{position:absolute;left:-60px;font-size:46px;animation:march 2.4s linear both}
.an-run .evm{animation-duration:1.6s}
@keyframes march{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 80px))}}
.an-parade .evm{animation-name:march,hop}
@keyframes hop{50%{translate:0 -14px}}
.evd{position:absolute;bottom:14px;left:50%;margin-left:-55px;font-size:110px;line-height:1;animation:taxiIn 1.1s cubic-bezier(.2,.8,.3,1.1) both}
.evp{position:absolute;top:8px;font-size:34px;animation:popUp .45s var(--spring) both}
.evs{position:absolute;left:50%;bottom:30px;margin-left:-55px;font-size:110px;line-height:1;animation:popUp .4s var(--spring) both,shk .12s linear .5s 10 alternate}
@keyframes shk{from{rotate:-6deg}to{rotate:6deg}}
.an-flicker{animation:skyFade 3s ease forwards,flick 1.2s steps(2) .3s 3}
@keyframes flick{50%{filter:brightness(.35)}}
.evb{position:absolute;left:50%;top:50%;font-size:36px;animation:burst 1.1s var(--ease-out) both}
@keyframes burst{from{transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) rotate(calc(-1*var(--a)));opacity:0}to{transform:translate(-50%,-50%) rotate(var(--a)) translateY(-120px) rotate(calc(-1*var(--a)));opacity:1}}
.evr{position:absolute;top:-40px;font-size:30px;animation:evRain 1.6s ease-in both}
@keyframes evRain{from{transform:translateY(0) rotate(0)}to{transform:translateY(240px) rotate(200deg)}}
.ev1{position:absolute;left:50%;bottom:30px;margin-left:-55px;font-size:110px;line-height:1}
.ev1.spin{animation:spinIn 1.1s cubic-bezier(.2,.8,.3,1) both}
.ev1.stamp{animation:stampIn .4s cubic-bezier(.5,0,.75,0) .4s both}
.ev1.bounce{animation:evBall 1.6s cubic-bezier(.3,0,.7,1) both}
@keyframes evBall{0%{transform:translate(-140px,-160px)}30%{transform:translate(-60px,0)}55%{transform:translate(10px,-90px)}75%{transform:translate(60px,0)}88%{transform:translate(90px,-30px)}100%{transform:translate(100px,0)}}

/* Afternoon turn during the sales */
.sim-alert{text-align:center;font-weight:700;font-size:14px;border-radius:12px;padding:8px 10px;animation:popUp .45s var(--spring) both}
.sim-alert.bad{background:#3D1E28;color:#FFD0D8;border:1px solid #7A2A3C}
.sim-alert.good{background:#3A3012;color:#FFE58A;border:1px solid #6B5A1E}

/* Event scenes: a fixed 300×200 stage, actors placed by keyframes */
.ev-scene{position:relative;width:300px;height:200px;flex-shrink:0;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
.ev-scene.grd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:rgba(0,0,0,.18);box-shadow:inset 0 3px 0 rgba(255,255,255,.15)}
.eva{position:absolute;left:0;top:0;line-height:1;z-index:1;opacity:0;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));will-change:transform}
.eva.chip-a{background:#fff;color:#1F7A45;font-family:var(--f-display);font-weight:600;padding:3px 10px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.2);filter:none}
.eva.chip-a.bad{color:#C0243A}
.eva.chip-a{direction:ltr;unicode-bidi:isolate}

    /* ── Street scene (simulation) ── */
    .st-scene { position: relative; height: 320px; border-radius: 26px; overflow: hidden; isolation: isolate; font-family: 'Rubik', sans-serif;
      background: linear-gradient(180deg, #4FC3F7 0%, #A5DEF8 55%, #E3F5FD 100%);
      box-shadow: 0 18px 40px -16px rgba(30,27,58,0.45), inset 0 0 0 3px rgba(255,255,255,0.55); }
    .st-w-nice { background: linear-gradient(180deg, #6DD0FA 0%, #B9E7FB 55%, #EEF9FE 100%); }
    .st-w-hot { background: linear-gradient(180deg, #FFA94D 0%, #FFD08A 55%, #FFF0D2 100%); }

    .st-sun-core { position: absolute; inset: 12px; border-radius: 50%; background: radial-gradient(circle at 40% 38%, #FFFBD0 0%, #FFE14D 45%, #FFB800 100%); box-shadow: 0 0 36px 10px rgba(255,210,60,0.55); }
    .st-sun-dim { opacity: 0.35; filter: blur(1px); }
    .st-w-hot .st-sun-core, .st-w-heat .st-sun-core { background: radial-gradient(circle at 40% 38%, #FFF6C0 0%, #FFC233 45%, #FF8A00 100%); box-shadow: 0 0 50px 18px rgba(255,150,40,0.6); }

    .st-w-lRain .st-cloud svg path, .st-w-hRain .st-cloud svg path { fill: #E3E8EE; }
    .st-skyline { position: absolute; left: -3%; width: 106%; bottom: 112px; height: 110px; z-index: 1; animation: stPar 16s ease-in-out infinite alternate; }
    .st-trees { position: absolute; left: -3%; width: 106%; bottom: 110px; height: 80px; z-index: 2; animation: stPar 11s ease-in-out infinite alternate-reverse; }
    .st-w-hRain .st-skyline, .st-w-lRain .st-skyline, .st-w-cold .st-skyline { filter: saturate(0.5) brightness(0.92); }
    .st-sidewalk { position: absolute; left: 0; right: 0; bottom: 46px; height: 68px; z-index: 3;
      background: linear-gradient(180deg, #9ED36A 0, #86C455 7px, #EADFC8 7px, #E2D4B8 100%);
      box-shadow: inset 0 -5px 0 #B9A88A; }
    .st-sidewalk::after { content: ''; position: absolute; inset: 7px 0 5px; background: repeating-linear-gradient(90deg, transparent 0 46px, rgba(150,130,100,0.25) 46px 48px); }
    .st-road { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; z-index: 3; background: linear-gradient(180deg, #5F6577, #4D5263); }
    .st-lane { position: absolute; left: 0; right: 0; top: 21px; height: 3px; background: repeating-linear-gradient(90deg, #F5F5F5 0 22px, transparent 22px 44px); opacity: 0.85; }
    .st-car { position: absolute; bottom: 6px; left: -80px; animation: stCar 13s linear infinite; animation-delay: 2s; }
    .st-car svg { animation: stCarBob 0.3s ease-in-out infinite alternate; }
    .st-rain { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
    .st-rain span { position: absolute; top: -30px; width: 2px; height: 24px; border-radius: 2px; background: linear-gradient(180deg, rgba(255,255,255,0), rgba(235,245,255,0.95)); animation: stRain linear infinite; }
    .st-w-lRain .st-trees, .st-w-hRain .st-trees { filter: saturate(0.6) brightness(0.85); }
    .st-w-lRain .st-sun, .st-w-hRain .st-sun { display: none; }
    .st-comp-wrap { position: absolute; bottom: 110px; z-index: 2; transform: scale(0.7); transform-origin: bottom center; }
    .st-comp { position: relative; display: flex; flex-direction: column; align-items: center; }
    .st-comp-price { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); background: #fff; color: #5B21B6; font-weight: 900; font-size: 13px; padding: 1px 8px; border-radius: 8px; box-shadow: 0 2px 0 #C4B5FD; white-space: nowrap; }
    .st-board { position: absolute; bottom: 56px; z-index: 6; animation: stSway 4s ease-in-out infinite; transform-origin: bottom center; }
    .st-stand { position: absolute; bottom: 56px; width: 140px; height: 150px; z-index: 5; }
    .st-stand-back, .st-stand-front { position: absolute; top: 0; left: 0; }
    .st-stand-front { z-index: 2; filter: drop-shadow(0 6px 4px rgba(30,27,58,0.18)); }
    .st-seller-wrap { position: absolute; left: 45px; top: 52px; z-index: 1; }
    .st-seller { display: block; animation: stBreathe 2.4s ease-in-out infinite; transform-origin: bottom center; }
    .st-seller-arm { transform-box: fill-box; transform-origin: 50% 8%; }
    .st-seller-cup { opacity: 0; }
    .st-serve .st-seller-arm { animation: stServe 0.75s var(--ease-out, ease-out); }
    .st-serve .st-seller-cup { animation: stCupShow 0.75s ease; }
    .st-bye .st-seller-arm { animation: stWave 0.6s ease-in-out infinite alternate; }
    .st-juice { transition: y 0.6s ease, height 0.6s ease; }
    .st-closed { transform-box: fill-box; transform-origin: 50% 0; animation: stSwing 1.6s var(--spring, ease) both; }
    .st-coins { position: absolute; right: 2px; bottom: 74px; z-index: 3; pointer-events: none; }
    .st-coin { position: absolute; right: 0; bottom: 0; white-space: nowrap; font-size: 12px; font-weight: 900; color: #8A5A00; background: #FFF6C2; border-radius: 10px; padding: 1px 6px; box-shadow: 0 2px 0 #E0B000; animation: stCoin 1.1s var(--ease-out, ease-out) forwards; }
    /* customers */
    .st-actor { position: absolute; left: 0; bottom: 56px; width: 40px; height: 102px; transition-property: transform; transition-timing-function: linear; will-change: transform; }
    .st-flip { transition: transform 0.2s ease; transform-origin: center; }
    .st-flipped { transform: scaleX(-1); }
    .st-body { position: relative; transform-origin: bottom center; transform: scale(1.12); }
    .st-body.st-kid { transform: scale(0.9); }
    .st-person { display: block; overflow: visible; }
    .st-leg, .st-arm { transform-box: fill-box; transform-origin: 50% 6%; }
    .st-walking .st-leg-a { animation: stSwingA 0.42s ease-in-out infinite; }
    .st-walking .st-leg-b { animation: stSwingB 0.42s ease-in-out infinite; }
    .st-walking .st-arm-a { animation: stSwingB 0.42s ease-in-out infinite; }
    .st-walking .st-arm-b { animation: stSwingA 0.42s ease-in-out infinite; }
    .st-walking .st-person { animation: stBob 0.21s ease-in-out infinite alternate; }
    .st-head { transform-box: fill-box; transform-origin: 50% 90%; }
    .st-shake .st-head { animation: stShake 0.32s ease-in-out 2; }
    .st-umbrella { transform-box: fill-box; transform-origin: 70% 100%; }
    .st-walking .st-umbrella { animation: stSway 0.84s ease-in-out infinite; }
    .st-vip { filter: drop-shadow(0 0 6px rgba(255,200,0,0.9)); }
    .st-vip::before { content: '✨'; position: absolute; top: -4px; right: -6px; font-size: 14px; animation: stTwinkle 1s ease-in-out infinite alternate; }
    .st-bubble { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; white-space: nowrap; background: #fff; border-radius: 14px; padding: 4px 9px 4px 7px; box-shadow: 0 6px 14px -4px rgba(30,27,58,0.4); border: 2px solid #E6E4F3; animation: stPop 0.35s var(--spring, ease) both; z-index: 50; }
    .st-bubble::after { content: ''; position: absolute; bottom: -8px; left: 50%; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; border-bottom: none; }
    .st-b-happy { border-color: #86E0A8; } .st-b-sad { border-color: #FBB6C4; } .st-b-vip { border-color: #FFC800; background: #FFFBE6; }
    .st-b-em { font-size: 17px; line-height: 1; }
    .st-b-tx { font-size: 11.5px; font-weight: 800; color: #1E1B3A; }
    .st-dusk { position: absolute; inset: 0; z-index: 45; pointer-events: none; background: linear-gradient(180deg, rgba(120,70,200,0.35), rgba(255,140,80,0.18) 60%, transparent); animation: stFade 1.2s ease both; }
    @keyframes stSpin { to { transform: rotate(360deg); } }
    @keyframes stDrift { from { left: -25%; } to { left: 110%; } }
    @keyframes stPar { from { transform: translateX(-7px); } to { transform: translateX(7px); } }
    @keyframes stCar { 0% { left: -80px; } 40% { left: 105%; } 100% { left: 105%; } }
    @keyframes stCarBob { from { transform: translateY(0); } to { transform: translateY(-1px); } }
    @keyframes stRain { from { transform: translateY(0) translateX(0); } to { transform: translateY(360px) translateX(-26px); } }
    @keyframes stSway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
    @keyframes stBreathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes stServe { 0% { transform: rotate(0); } 35% { transform: rotate(-95deg); } 65% { transform: rotate(-80deg); } 100% { transform: rotate(0); } }
    @keyframes stCupShow { 0%, 15% { opacity: 0; } 25%, 70% { opacity: 1; } 85%, 100% { opacity: 0; } }
    @keyframes stWave { from { transform: rotate(-150deg); } to { transform: rotate(-110deg); } }
    @keyframes stSwing { 0% { transform: rotate(-30deg) translateY(-30px); opacity: 0; } 40% { transform: rotate(14deg); opacity: 1; } 70% { transform: rotate(-7deg); } 100% { transform: rotate(0); opacity: 1; } }
    @keyframes stCoin { 0% { opacity: 0; transform: translateY(6px) scale(0.6); } 20% { opacity: 1; transform: translateY(-6px) scale(1.1); } 100% { opacity: 0; transform: translateY(-44px) scale(1); } }
    @keyframes stSwingA { 0%, 100% { transform: rotate(22deg); } 50% { transform: rotate(-22deg); } }
    @keyframes stSwingB { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(22deg); } }
    @keyframes stBob { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }
    @keyframes stShake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
    @keyframes stTwinkle { from { opacity: 0.4; transform: scale(0.8) rotate(0); } to { opacity: 1; transform: scale(1.2) rotate(20deg); } }
    @keyframes stPop { from { opacity: 0; transform: translateX(-50%) translateY(8px) scale(0.4); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
    @keyframes stFade { from { opacity: 0; } to { opacity: 1; } }

      .st-rays, .st-cloud, .st-skyline, .st-trees, .st-car, .st-board, .st-seller, .st-rain span { animation: none !important; }
    }

    /* Marketing on the street */
    .st-shade { position: absolute; bottom: 56px; z-index: 4; transform-origin: bottom center; animation: stSway 6s ease-in-out infinite; }
    .st-bigsign { position: absolute; bottom: 210px; z-index: 6; width: 120px; text-align: center; background: #FFF8DC; border: 3px solid #B07A44; border-radius: 9px; padding: 3px 0; font-size: 12.5px; color: #8A5A00; box-shadow: 0 0 0 2px #FFE14D, 0 0 14px #FFE14D; animation: stBulbs 1s steps(2) infinite; }
    .st-bigsign i { position: absolute; left: 50%; top: 100%; width: 4px; height: 6px; background: #8C6A4F; transform: translateX(-50%); }
    .st-balloons { position: absolute; bottom: 0; z-index: 7; width: 60px; height: 0; }
    .st-balloons span { position: absolute; width: 16px; height: 20px; border-radius: 50% 50% 45% 45%; animation: stBob 2.4s ease-in-out infinite; }
    .st-balloons span::after { content: ''; position: absolute; left: 50%; top: 100%; width: 1px; height: 40px; background: rgba(60,50,80,.5); }
    .st-flyers span { position: absolute; left: -10%; font-size: 16px; z-index: 8; animation: stFly 9s linear infinite; }
    .st-hearts { position: absolute; bottom: 200px; z-index: 8; width: 50px; }
    .st-hearts span { position: absolute; bottom: 0; font-size: 15px; opacity: 0; animation: stRise 2.7s ease-out infinite; }
    @keyframes stBulbs { 0% { box-shadow: 0 0 0 2px #FFE14D, 0 0 14px #FFE14D; } 100% { box-shadow: 0 0 0 2px #FF9F1C, 0 0 6px #FF9F1C; } }
    @keyframes stBob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
    @keyframes stFly { 0% { left: -10%; transform: rotate(0); } 50% { transform: translateY(20px) rotate(180deg); } 100% { left: 110%; transform: rotate(360deg); } }
    @keyframes stRise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-60px) scale(1.1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .st-shade, .st-bigsign, .st-balloons span, .st-flyers span, .st-hearts span { animation: none !important; } .st-hearts span { opacity: 1; } }

    .st-comp-fx { position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 14px; background: rgba(255,255,255,.85); border-radius: 8px; padding: 0 4px; animation: stBob 2.4s ease-in-out infinite; }
